# ---- MySQL (default). Override with env vars DB_URL / DB_USER / DB_PASSWORD ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codementor?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.jwt.secret=${JWT_SECRET:codementor-campus-dev-secret-change-me-please-0123456789}
app.jwt.expiration-hours=24
app.cors.origins=http://localhost:5173
